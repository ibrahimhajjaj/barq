# A version tag runs the tests and makes the GitHub release. Publishing to npm happens by hand, from a
# machine behind the owner's two-factor login, so nothing in this repository can publish.
#
# The actions are pinned to commits, since a version tag on an action can be moved.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm test
      - name: The tag is the version in package.json
        run: |
          V=$(node -e 'console.log(require("./package.json").version)')
          if [ "${GITHUB_REF_NAME#v}" != "$V" ]; then echo "$GITHUB_REF_NAME is not v$V, the version in package.json"; exit 1; fi

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for the GitHub release
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes
