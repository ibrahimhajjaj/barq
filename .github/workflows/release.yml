# A tag named after the version puts that version on npm. To release: npm version patch, then git push --follow-tags.
# npm trusts this workflow directly (OIDC), so GitHub holds no npm token. Set up once with:
#   npx npm@latest trust github barq --file release.yml --repo ibrahimhajjaj/barq --allow-publish
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # for the GitHub release
  id-token: write   # for publishing without a token, and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm install --global npm@latest   # publishing without a token needs npm 11.5.1 or later
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm test
      - name: The tag is the version in package.json
        run: |
          V=$(node -e 'console.log(require("./package.json").version)')
          if [ "${GITHUB_REF_NAME#v}" != "$V" ]; then echo "$GITHUB_REF_NAME is not v$V, the version in package.json"; exit 1; fi
      - name: Publish to npm
        run: |
          V=$(node -e 'console.log(require("./package.json").version)')
          if npm view "barq@$V" version >/dev/null 2>&1; then echo "barq@$V is already on npm, skipping"; else npm publish --access public; fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
